<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identificador de Cajas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft: #dbc79f;
    --kraft-dark: #c3a878;
    --kraft-deep: #a9865a;
    --ink: #2c2318;
    --ink-soft: #5a4c38;
    --stamp-red: #b23a1f;
    --stamp-green: #3f6b4a;
    --paper: #f2e9d6;
    --line: #8a6f47;
    --shadow: rgba(44,35,24,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 2px, transparent 2px, transparent 14px),
      var(--kraft);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  header{
    padding:36px 20px 28px;
    text-align:center;
    border-bottom:4px solid var(--ink);
    background:var(--kraft-dark);
    position:relative;
  }
  header::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-4px;
    height:4px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 12px, transparent 12px 24px);
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:clamp(28px,5vw,44px);
    margin:0;
  }
  .subtitle{
    margin-top:8px;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:0 20px;
  }
  .panel{
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--shadow);
    margin-top:-2px;
  }
  .form-panel{
    margin-top:32px;
    padding:28px;
  }
  .form-title{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:18px;
    font-weight:600;
    margin:0 0 18px 0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .form-title::before{
    content:"";
    width:10px;height:10px;
    background:var(--stamp-red);
    display:inline-block;
    transform:rotate(45deg);
  }
  .fields{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:18px;
  }
  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:18px;
    font-weight:600;
    border:2px solid var(--ink);
    background:#fffdf8;
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    border-color:var(--stamp-red);
    background:#fff;
  }
  .unit-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
    font-size:13px;
  }
  .unit-row span{color:var(--ink-soft); text-transform:uppercase; letter-spacing:1px; font-size:11px;}
  .toggle{
    display:flex;
    border:2px solid var(--ink);
    overflow:hidden;
  }
  .toggle button{
    border:none;
    background:#fffdf8;
    padding:8px 18px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  .toggle button.active{
    background:var(--ink);
    color:var(--paper);
  }
  .search-btn{
    width:100%;
    padding:16px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:3px;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition:background 0.15s;
  }
  .search-btn:hover{background:var(--stamp-red);}
  .search-btn:active{transform:translateY(1px);}

  .results{
    margin-top:28px;
  }
  .results-count{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
    padding-left:4px;
  }
  .card{
    background:#fffdf8;
    border:2px solid var(--ink);
    margin-bottom:16px;
    padding:0;
    position:relative;
    box-shadow:4px 4px 0 var(--shadow);
    display:flex;
    flex-wrap:wrap;
  }
  .card.exact{ border-color: var(--stamp-green); }

  .card-main{
    flex:1 1 260px;
    padding:20px 22px;
    border-right:2px dashed var(--line);
  }
  .card-code{
    font-size:11px;
    letter-spacing:2px;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .card-name{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    font-weight:600;
    margin:4px 0 10px 0;
  }
  .card-tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .tag{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:3px 8px;
    border:1px solid var(--line);
    color:var(--ink-soft);
  }
  .card-dims{
    flex:0 0 210px;
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
  }
  .dim-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    font-size:14px;
    border-bottom:1px dotted var(--line);
    padding-bottom:6px;
  }
  .dim-row .lbl{color:var(--ink-soft); text-transform:uppercase; font-size:11px; letter-spacing:1px; flex:0 0 auto;}
  .dim-row .right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    line-height:1.3;
  }
  .dim-row .val{font-weight:700; white-space:nowrap;}
  .dim-row .diff{font-size:11px; color:var(--stamp-red); white-space:nowrap;}
  .dim-row .diff.zero{color:var(--stamp-green);}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty b{color:var(--ink);}

  footer{
    text-align:center;
    margin-top:40px;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  @media (max-width:600px){
    .fields{grid-template-columns:1fr;}
    .card-dims{border-right:none;}
    .card-main{border-right:none; border-bottom:2px dashed var(--line);}
  }
</style>
</head>
<body>

<header>
  <h1>Identificador de Cajas</h1>
  <div class="subtitle">Busca por medidas montadas &middot; Ancho &times; Largo &times; Alto</div>
</header>

<div class="wrap">
  <div class="panel form-panel">
    <div class="form-title">Introduce las medidas</div>
    <div class="fields">
      <div class="field">
        <label for="in-ancho">Ancho</label>
        <input type="number" id="in-ancho" placeholder="0" step="any" min="0">
      </div>
      <div class="field">
        <label for="in-largo">Largo</label>
        <input type="number" id="in-largo" placeholder="0" step="any" min="0">
      </div>
      <div class="field">
        <label for="in-alto">Alto</label>
        <input type="number" id="in-alto" placeholder="0" step="any" min="0">
      </div>
    </div>
    <div class="unit-row">
      <span>Unidad</span>
      <div class="toggle" id="unit-toggle">
        <button data-unit="mm" class="active">mm</button>
        <button data-unit="cm">cm</button>
      </div>
    </div>
    <button class="search-btn" id="search-btn">Buscar caja</button>
  </div>

  <div class="results" id="results"></div>

  <footer>154 modelos cargados desde el catálogo &middot; Coincidencia por medidas montadas, en cualquier orientación</footer>
</div>

let unit = 'mm';
document.getElementById('unit-toggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  unit = btn.dataset.unit;
  document.querySelectorAll('#unit-toggle button').forEach(b=>b.classList.toggle('active', b===btn));
});

function permutations(arr){
  if(arr.length <= 1) return [arr];
  const result = [];
  for(let i=0;i<arr.length;i++){
    const rest = arr.slice(0,i).concat(arr.slice(i+1));
    for(const p of permutations(rest)){
      result.push([arr[i], ...p]);
    }
  }
  return result;
}

function bestMatch(box, target){
  const boxDims = [box.ancho_cerrada, box.largo_cerrada, box.alto_cerrado];
  let best = null;
  for(const perm of permutations(boxDims)){
    const diffs = [Math.abs(perm[0]-target[0]), Math.abs(perm[1]-target[1]), Math.abs(perm[2]-target[2])];
    const total = diffs[0]+diffs[1]+diffs[2];
    if(best === null || total < best.total){
      best = {total, perm, diffs};
    }
  }
  return best;
}

function fmt(n){
  if(n === null || n === undefined) return '—';
  return Number.isInteger(n) ? n.toString() : n.toFixed(1);
}

function render(target){
  const resultsEl = document.getElementById('results');
  if(!target){
    resultsEl.innerHTML = '<div class="empty">Introduce las tres medidas de tu producto y pulsa <b>Buscar caja</b> para encontrar la caja que mejor encaja.</div>';
    return;
  }

  const scored = BOXES.map(box=>{
    const m = bestMatch(box, target);
    return {box, ...m};
  }).sort((a,b)=>a.total-b.total);

  const top = scored.slice(0, 12);

  let html = `<div class="results-count">${scored.filter(s=>s.total===0).length} coincidencia(s) exacta(s) &middot; mostrando las 12 más cercanas</div>`;

  for(const s of top){
    const b = s.box;
    const isExact = s.total === 0;
    const [dA, dL, dH] = s.diffs;
    const [pA, pL, pH] = s.perm;
    html += `
    <div class="card ${isExact ? 'exact' : ''}">
      <div class="card-main">
        <div class="card-code">Código ${b.codigo ?? '—'}</div>
        <div class="card-name">${b.modelo ?? 'Sin nombre'}</div>
        <div class="card-tags">
          ${b.calidad ? `<span class="tag">Calidad ${b.calidad}</span>` : ''}
          ${b.tipologia ? `<span class="tag">Tipo ${b.tipologia}</span>` : ''}
          ${b.impresion && b.impresion !== 'No' ? `<span class="tag">${b.impresion}</span>` : ''}
        </div>
      </div>
      <div class="card-dims">
        <div class="dim-row"><span class="lbl">Ancho</span><span class="right"><span class="val">${fmt(pA)} mm</span>${dA>0?`<span class="diff">±${fmt(dA)} mm</span>`:`<span class="diff zero">exacto</span>`}</span></div>
        <div class="dim-row"><span class="lbl">Largo</span><span class="right"><span class="val">${fmt(pL)} mm</span>${dL>0?`<span class="diff">±${fmt(dL)} mm</span>`:`<span class="diff zero">exacto</span>`}</span></div>
        <div class="dim-row"><span class="lbl">Alto</span><span class="right"><span class="val">${fmt(pH)} mm</span>${dH>0?`<span class="diff">±${fmt(dH)} mm</span>`:`<span class="diff zero">exacto</span>`}</span></div>
      </div>
    </div>`;
  }

  resultsEl.innerHTML = html;
}

document.getElementById('search-btn').addEventListener('click', ()=>{
  const a = parseFloat(document.getElementById('in-ancho').value);
  const l = parseFloat(document.getElementById('in-largo').value);
  const h = parseFloat(document.getElementById('in-alto').value);
  if(isNaN(a) || isNaN(l) || isNaN(h)){
    alert('Introduce las tres medidas (ancho, largo y alto).');
    return;
  }
  const factor = unit === 'cm' ? 10 : 1;
  render([a*factor, l*factor, h*factor]);
});

['in-ancho','in-largo','in-alto'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('search-btn').click();
  });
});

render(null);
</script>
